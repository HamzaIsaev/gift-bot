services:
  gift-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/gift_bot.sqlite3
      # Админ-панель снаружи контейнера; без PANEL_PASSWORD в .env она не запустится
      PANEL_HOST: 0.0.0.0
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    shm_size: "1gb"   # Chromium падает с маленьким /dev/shm
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
